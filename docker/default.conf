server {
  listen 8080;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Probe của Kubernetes: chỉ trả lời từ chính nginx, không chạm backend. Nếu
  # probe phụ thuộc backend thì backend hỏng sẽ kéo theo pod FE bị khởi động
  # lại — biến một sự cố thành hai.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Khối /api do entrypoint sinh ra lúc khởi động, tuỳ theo API_UPSTREAM.
  include /tmp/nginx-api.conf;

  # Tên file asset có hash nên nội dung không bao giờ đổi dưới cùng một tên.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html thì ngược lại: phải luôn lấy bản mới, nếu không trình duyệt sẽ
  # giữ trang cũ trỏ tới bundle đã bị xoá sau lần deploy kế tiếp.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: react-router xử lý đường dẫn phía client, nên mọi route không phải
  # file tĩnh đều trả index.html thay vì 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
