apiVersion: apps/v1
kind: Deployment
metadata:
  name: msb-guardian-fe
  namespace: finance-demo
  labels:
    app: msb-guardian-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msb-guardian-fe
  template:
    metadata:
      labels:
        app: msb-guardian-fe
    spec:
      imagePullSecrets:
        - name: vcr-cred
      containers:
        - name: msb-guardian-fe
          # CI thay :latest bằng commit SHA lúc deploy.
          image: vcr.vngcloud.vn/114544-ea-hackathon/msb-guardian-fe:latest
          imagePullPolicy: IfNotPresent
          env:
            # guardian-gateway phục vụ đúng 7 endpoint FE gọi dưới /api/*.
            # nginx phân giải tên này NGAY LÚC KHỞI ĐỘNG, nên Service
            # guardian-gateway phải tồn tại trước khi pod FE lên — thiếu DNS là
            # nginx không start được chứ không phải chỉ lỗi lúc gọi.
            - name: API_UPSTREAM
              value: "http://guardian-gateway"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: msb-guardian-fe
  namespace: finance-demo
  labels:
    app: msb-guardian-fe
spec:
  # NodePort chứ không ClusterIP: ALB của VNG định tuyến tới node port và từ chối
  # backend ClusterIP. Ingress "guardian" trong repo msb-finance-platform trỏ tới
  # Service này; đổi lại ClusterIP là trang công khai ngừng hoạt động.
  type: NodePort
  selector:
    app: msb-guardian-fe
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
